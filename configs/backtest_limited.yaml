######################################################################
# Backtest tool V2 configuration (limited mode)
# - Keep the same time ranges as backtest.yaml
# - Use lower model threads for laptop stability
# - For custom factor libraries, select Top50 by Rank ICIR
######################################################################

random_seed: 42

experiment:
  name: "backtest_v2_experiment"
  recorder: "backtest_v2_recorder"
  output_dir: "data/results/backtest_v2_results"
  output_metrics_file: "backtest_metrics.json"

factor_source:
  # type: alpha158 | alpha158_20 | alpha360 | custom | combined
  type: "alpha158_20"

  custom:
    json_files: []
    quality_filter: null
    # Limited mode: use top factors only to reduce memory/compute pressure.
    max_factors: 50
    # Rank by metric in factor JSON backtest_results.
    ranking_metric: "Rank ICIR"
    ranking_ascending: false
    use_llm_for_incompatible: true

  combined:
    official_source: "alpha158_20"
    include_custom: true

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "csi300"
  start_time: "2016-01-01"
  end_time: "2025-12-26"

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2016-01-01", "2020-12-31"]
    valid: ["2021-01-01", "2021-12-31"]
    test:  ["2022-01-01", "2025-12-26"]

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    # Lower thread count for 8-core/16GB laptops.
    num_threads: 6
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5

  backtest:
    start_time: "2022-01-01"
    end_time: "2025-12-26"
    account: 100000000
    benchmark: "SH000300"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

llm:
  enabled: true
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache"
  auto_extract_cache: false
  debug: false

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
  data_file: null

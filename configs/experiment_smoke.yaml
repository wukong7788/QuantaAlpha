planning:
  enabled: false
  num_directions: 1
  max_attempts: 1
  use_llm: false
  allow_fallback: true
  prompt_file: planning_prompts.yaml

execution:
  max_loops: 1
  steps_per_loop: 5
  step_n: null
  use_local: true
  parallel_execution: false
  branch_log_root: log
  branch_log_prefix: branch

evolution:
  enabled: false
  mutation_enabled: false
  crossover_enabled: false
  max_rounds: 1
  crossover_size: 2
  crossover_n: 1
  parallel_enabled: false
  max_parallel_workers: 2
  max_empty_retries: 1
  prefer_diverse_crossover: false
  parent_selection_strategy: best
  top_percent_threshold: 0.3
  fresh_start: true
  cleanup_on_finish: true

quality_gate:
  consistency_enabled: false
  complexity_enabled: true
  redundancy_enabled: true
  consistency_strict_mode: false
  max_correction_attempts: 1
  # NOTE: Disabled by default (A/B under STEP_N=3 showed negative wall-time impact).
  cheap_filter_enabled: false
  cheap_filter_require_acceptable: false
  subtree_blacklist_enabled: false
  subtree_blacklist_path: null
  subtree_blacklist_max_patterns: 200
  subtree_blacklist_min_nodes: 1
  max_construct_failures_per_branch: 2
  max_json_parse_failures_per_branch: 2

factor:
  factors_per_hypothesis: 1
  complexity:
    symbol_length_threshold: 200
    base_features_threshold: 5
    free_args_ratio_threshold: 0.5
  duplication:
    enabled: true
    threshold: 5
    factor_zoo_path: null

backtest:
  use_docker: false
  timeout: 800
  qlib:
    config_name: conf_baseline.yaml

llm:
  # [Optimization Added, not original baseline defaults]
  # Keep smoke and main config semantics aligned.
  factor_mining_timeout: 999999
  max_retries: 3
  retry_delay: 1.0
  json_mode_strict: true
  json_mode_temperature: 0.7
  freeform_temperature: 0.7
  json_mode_response_format: json_object
  json_mode_json_schema: ""
  request_timeout_s: 60.0
  retry_backoff: exponential
  retry_jitter: true
  retry_max_wait_seconds: 30.0
  failover_base_urls: []

logging:
  level: INFO
  save_snapshots: true
  save_trajectory_pool: false

prompts:
  planning: planning_prompts.yaml
  evolution: evolution_prompts.yaml

name: update_sync

on:
  workflow_dispatch:
  push:
    branches:
      - codex/my-fix

jobs:
  update-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync docs to GitHub
        if: github.ref_name == 'codex/my-fix'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add SPECS.md README.md README_CN.md CHANGELOG.md CHANGELOG_CN.md docs || true
            if [[ -n "$(git diff --cached --name-only)" ]]; then
              git commit -m "chore(docs): update_sync auto sync [skip ci]"
              git push
            else
              echo "No related docs changes to sync."
            fi
          else
            echo "Working tree clean, nothing to sync."
          fi
